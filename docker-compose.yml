services:
  openlist:
    restart: always
    volumes:
      - '/etc/openlist:/opt/openlist/data'
    ports:
      - '5244:5244'
      - '5245:5245'
    user: '0:0'
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
      - DOWNLOAD_QUOTA_LIMIT=20
    container_name: openlist
    image: 'openlist-quota:latest'
